<!doctype html>
<html lang="uk" dir="ltr">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="theme-color" content="#000000" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Акцент і контраст — до першого кадру, інакше сторінка спершу
         малюється синьою. Ключі ті самі, що в stores/appearance.svelte.ts.
         Значення перевіряється: у сховищі може лежати що завгодно. -->
    <script>
      try {
        var accent = localStorage.getItem('zunor-accent')
        if (accent && /^[a-z]{2,16}$/.test(accent)) {
          document.documentElement.dataset.accent = accent
        }
        if (localStorage.getItem('zunor-contrast') === 'more') {
          document.documentElement.dataset.contrast = 'more'
        }
      } catch (e) {}
    </script>

    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
