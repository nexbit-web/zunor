<!doctype html>
<html lang="uk" dir="ltr">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="theme-color" content="#000000" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Акцент і контраст — до першого кадру, інакше сторінка спершу
         малюється синьою. Ключі ті самі, що в stores/appearance.svelte.ts.
         Значення перевіряється: у сховищі може лежати що завгодно. -->
    <script>
      try {
        var accent = localStorage.getItem('zunor-accent')
        if (accent && /^[a-z]{2,16}$/.test(accent)) {
          document.documentElement.dataset.accent = accent
        }
        if (localStorage.getItem('zunor-contrast') === 'more') {
          document.documentElement.dataset.contrast = 'more'
        }
      } catch (e) {}
    </script>

    <!-- Палітра кабінету (in-app) і темна тема — лише в кабінеті
         (/dashboard/**), до першого кадру. Решта сайту завжди світла й
         на своїй палітрі. Правило те саме, що в $lib/theme-scope.ts;
         ключ і «system» за замовчуванням — як у mode-watcher. -->
    <script>
      try {
        var path = location.pathname
        if (path === '/dashboard' || path.indexOf('/dashboard/') === 0) {
          document.documentElement.classList.add('in-app')
          var m = localStorage.getItem('mode-watcher-mode') || 'system'
          if (
            m === 'dark' ||
            (m === 'system' &&
              matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark')
          }
        }
      } catch (e) {}
    </script>

    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
